name = "bill2crm-tenant-proxy"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Route every subdomain of bill2crm.in to this Worker. Requires bill2crm.in to be an active
# zone in this Cloudflare account. Must come before [vars] — TOML tables swallow any bare
# key that follows them until the next [section] header.
routes = [
  { pattern = "*.bill2crm.in/*", zone_name = "bill2crm.in" }
]

# Fill in the actual Web App deployment origin (Netlify URL or the custom domain pointed at it)
# before deploying. This can also be set as a Worker secret instead if you'd rather not commit it.
[vars]
WEB_APP_ORIGIN = "https://YOUR-WEB-APP-DEPLOYMENT.netlify.app"
